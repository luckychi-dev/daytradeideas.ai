services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: daytrade
      POSTGRES_USER: daytrade
      POSTGRES_PASSWORD: daytrade
    ports:
      - "5432:5432"
    volumes:
      - daytrade-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daytrade -d daytrade"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://daytrade:daytrade@postgres:5432/daytrade
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  telegram-interface:
    build:
      context: .
      dockerfile: interfaces/telegram/Dockerfile
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      TELEGRAM_PORT: 3001
      BACKEND_URL: http://backend:3000
    ports:
      - "3001:3001"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web-interface:
    build:
      context: .
      dockerfile: interfaces/web/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      WEB_PORT: 3002
      WEB_PUBLIC_URL: http://localhost:3002
      BACKEND_URL: http://backend:3000
    ports:
      - "3002:3002"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3002/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  daytrade-postgres:
